<script>
    function calcVoto() {
        let v1 = document.getElementsByName("v1")[0].value;
        let v2 = document.getElementsByName("v2")[0].value;
        let v3 = document.getElementsByName("v3")[0].value;
        let v4 = document.getElementsByName("v4")[0].value;
        let v5 = document.getElementsByName("v5")[0].value;
        let v6 = document.getElementsByName("v6")[0].value;
	
	if (Number(v1)+Number(v2)+Number(v3)+Number(v4)<5 && Number(v5)==0)
	{
	    let voto = 4*.75 + .25* (Number(v5) + Number(v6));
            document.getElementsByName("voto")[0].value = voto;}
	if (Number(v1)+Number(v2)+Number(v3)+Number(v4)<5 && Number(v5)>0)
	{
	    let voto = 2 + .25* (Number(v5) + Number(v6));
            document.getElementsByName("voto")[0].value = voto;}
	
	if (Number(v1)+Number(v2)+Number(v3)+Number(v4)>=6 && Number(v1)+Number(v2)+Number(v3)+Number(v4)<=8 && Number(v5)==0)
	{
	    let voto = 5*.75 + .25* (Number(v5) + Number(v6));
            document.getElementsByName("voto")[0].value = voto;}
	if (Number(v1)+Number(v2)+Number(v3)+Number(v4)>=6 && Number(v1)+Number(v2)+Number(v3)+Number(v4)<=8 && Number(v5)>0)
	{
	    let voto = 2.5 + .25* (Number(v5) + Number(v6));
            document.getElementsByName("voto")[0].value = voto;}
	
	if (Number(v1)+Number(v2)+Number(v3)+Number(v4)>=9 && Number(v1)+Number(v2)+Number(v3)+Number(v4)<=11 && Number(v5)==0)
	{
	    let voto = 6*.75 + .25* (Number(v5) + Number(v6));
            document.getElementsByName("voto")[0].value = voto;}
	if (Number(v1)+Number(v2)+Number(v3)+Number(v4)>=9 && Number(v1)+Number(v2)+Number(v3)+Number(v4)<=11 && Number(v5)>0)
	{
	    let voto = 3 + .25* (Number(v5) + Number(v6));
            document.getElementsByName("voto")[0].value = voto;}
	
	if (Number(v1)+Number(v2)+Number(v3)+Number(v4)>=12 && Number(v1)+Number(v2)+Number(v3)+Number(v4)<=14 && Number(v5)==0)
	{
	    let voto = 7*.75 + .25* (Number(v5) + Number(v6));
            document.getElementsByName("voto")[0].value = voto;}
	if (Number(v1)+Number(v2)+Number(v3)+Number(v4)>=12 && Number(v1)+Number(v2)+Number(v3)+Number(v4)<=14 && Number(v5)>0)
	{
	    let voto = 3.5 + .25* (Number(v5) + Number(v6));
            document.getElementsByName("voto")[0].value = voto;}
	
	if (Number(v1)+Number(v2)+Number(v3)+Number(v4)>=15 && Number(v1)+Number(v2)+Number(v3)+Number(v4)<=17 && Number(v5)==0)
	{
	    let voto = 8*.75 + .25* (Number(v5) + Number(v6));
            document.getElementsByName("voto")[0].value = voto;}
	if (Number(v1)+Number(v2)+Number(v3)+Number(v4)>=15 && Number(v1)+Number(v2)+Number(v3)+Number(v4)<=17 && Number(v5)>0)
	{
	    let voto = 4 + .25* (Number(v5) + Number(v6));
            document.getElementsByName("voto")[0].value = voto;}
	
	if (Number(v1)+Number(v2)+Number(v3)+Number(v4)>=18 && Number(v1)+Number(v2)+Number(v3)+Number(v4)<=19 && Number(v5)==0)
	{
	    let voto = 9*.75 + .25* (Number(v5) + Number(v6));
            document.getElementsByName("voto")[0].value = voto;}
	if (Number(v1)+Number(v2)+Number(v3)+Number(v4)>=18 && Number(v1)+Number(v2)+Number(v3)+Number(v4)<=19 && Number(v5)>0)
	{
	    let voto = 4.5 + .25* (Number(v5) + Number(v6));
            document.getElementsByName("voto")[0].value = voto;}
	
	if (Number(v1)+Number(v2)+Number(v3)+Number(v4)==20 && Number(v5)==0)
	{
	    let voto = 10*.75 + .25* (Number(v5) + Number(v6));
            document.getElementsByName("voto")[0].value = voto;}
	if (Number(v1)+Number(v2)+Number(v3)+Number(v4)==20 && Number(v5)>0)
	{
	    let voto = 5 + .25* (Number(v5) + Number(v6));
            document.getElementsByName("voto")[0].value = voto;}

	if (Number(v1)<1 || Number(v1)>5 || Number(v2)<1 || Number(v2)>5 || Number(v3)<1 || Number(v3)>5 || Number(v4)<1 || Number(v4)>5 || Number(v5)<4 || Number(v5)>10 || Number(v6)<4 || Number(v6)>10)
	{
	    let voto = "Volore errato";
            document.getElementsByName("voto")[0].value = voto;}
    }
</script>
